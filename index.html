<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sravani Weather</title><style>body{font-family:Arial;text-align:center;padding:20px;background:#f0f2f5}input{padding:12px;width:200px;border-radius:10px;border:1px solid #999}button{padding:12px;background:#007bff;color:#fff;border:0;border-radius:10px}.card{background:#fff;padding:30px;border-radius:20px;max-width:380px;margin:20px auto}#temp{font-size:48px;color:#007bff;font-weight:bold}</style></head><body><h2>☀️ Sravani Weather App</h2><input id="cityInput" value="Guntur"><button id="searchBtn">Search</button><div class="card"><div id="temp">--°C</div><div id="cityName">--</div><div id="condition">--</div><div id="humidity"></div><div id="wind"></div></div><p>Made by Sravani</p><script>async function getWeather(){let c=document.getElementById("cityInput").value.trim();if(!c)return;document.getElementById("temp").innerText="Loading...";try{let g=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+c+"&count=1&language=en&format=json");let gd=await g.json();let la=gd.results[0].latitude,lo=gd.results[0].longitude,na=gd.results[0].name;let w=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+la+"&longitude="+lo+"&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code");let wd=await w.json();let cu=wd.current;document.getElementById("temp").innerText=Math.round(cu.temperature_2m)+"°C";document.getElementById("cityName").innerText=na;document.getElementById("condition").innerText="Code: "+cu.weather_code;document.getElementById("humidity").innerText=cu.relative_humidity_2m+"% Humidity";document.getElementById("wind").innerText=cu.wind_speed_10m+" km/h Wind";}catch(e){document.getElementById("temp").innerText="--°C";}}document.getElementById("searchBtn").addEventListener("click",getWeather);getWeather();</script></body></html>
